<!DOCTYPE html>
<html>
<head>
  <title>AI Copilot Settings</title>
  <style>
    body { font-family: sans-serif; padding: 20px; width: 350px; background-color: #fafafa;}
    h2 { font-size: 18px; margin-top: 0; color: #262626;}
    label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; color: #262626;}
    input[type="text"], textarea { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;}
    textarea { height: 180px; resize: vertical; }
    button { margin-top: 20px; padding: 10px 15px; background-color: #0095f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: background-color 0.2s;}
    button:hover { background-color: #1877f2; }
    #status { margin-top: 10px; color: #0095f6; display: none; text-align: center; font-size: 14px; font-weight: bold;}
    .help-text { font-size: 12px; color: #8e8e8e; margin-top: 4px; line-height: 1.3;}
  </style>
</head>
<body>
  <h2>⚙️ AI Copilot Settings</h2>
  
  <label for="apiKey">Gemini API Key</label>
  <input type="text" id="apiKey" placeholder="Enter your Gemini API Key">
  <div class="help-text">You need this to connect to Google's AI. Get it free from Google AI Studio.</div>

  <label for="prompt">Personality Prompt</label>
  <textarea id="prompt" placeholder="Describe your chatting style..."></textarea>
  <div class="help-text">This is how the AI learns to sound like you. I've pre-filled it based on your chat history!</div>

  <button id="saveBtn">Save Settings</button>
  <div id="status">Settings saved successfully!</div>

  <script src="options.js"></script>
</body>
</html>
